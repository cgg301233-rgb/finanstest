<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Документ — FinTest</title>
    <style>
        :root {
            --bg: #f1f5fc;
            --card-bg: rgba(255,255,255,0.96);
            --text: #1f3a5f;
            --heading: #1e2f5e;
            --sub: #5b6e8c;
            --btn-bg: #f8faff;
            --btn-border: #e9eef4;
            --btn-hover: #eef3fe;
            --btn-primary: #1e4668;
            --btn-primary-hover: #0f3555;
            --shadow: 0 20px 40px rgba(0,0,0,0.05);
            --font: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            --nav-height: 64px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font);
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: var(--card-bg);
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 1px solid #e9eef4;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Гамбургер */
        .hamburger {
            width: 36px;
            height: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            z-index: 1100;
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 4px;
            background: var(--heading);
            border-radius: 4px;
            transition: 0.3s;
        }

        /* Название */
        .navbar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e2f5e, #2a4b7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Кнопка справа */
        .btn {
            border: none;
            background: var(--btn-bg);
            padding: 10px 20px;
            border-radius: 28px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid var(--btn-border);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--btn-primary);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: var(--btn-primary-hover);
        }

        /* ===== ВЫПАДАЮЩЕЕ МЕНЮ ===== */
        .side-menu {
            position: fixed;
            top: var(--nav-height);
            left: -280px;
            width: 260px;
            height: calc(100vh - var(--nav-height));
            background: var(--card-bg);
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            border-right: 1px solid #e9eef4;
            padding: 24px 16px;
            transition: left 0.3s ease;
            z-index: 999;
            display: flex;
            flex-direction: column;
        }

        .side-menu.open {
            left: 0;
        }

        .side-menu a {
            display: block;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 16px;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            transition: 0.2s;
        }

        .side-menu a:hover {
            background: #eef3fe;
            color: #1e4668;
        }

        .side-menu a.active {
            background: #eef3fe;
            color: #1e4668;
        }

        /* Затемнение при открытом меню */
        .overlay {
            position: fixed;
            top: var(--nav-height);
            left: 0;
            width: 100%;
            height: calc(100vh - var(--nav-height));
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            z-index: 998;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main-content {
            flex: 1;
            margin-top: var(--nav-height);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px;
        }

        .doc-card {
            width: 100%;
            max-width: 960px;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: var(--shadow);
            padding: 28px 24px;
        }

        .document-viewer {
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 24px;
            background: #fff;
        }

        iframe {
            width: 100%;
            height: 75vh;
            min-height: 500px;
            border: none;
            display: block;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .no-pdf-warning {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 16px;
            border-radius: 12px;
            color: #856404;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="navbar">
        <div class="navbar-left">
            <button class="hamburger" id="hamburgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <span class="navbar-brand">📄 FinTest Документ</span>
        </div>
        <a href="index.html" class="btn btn-primary">Онлайн‑тренажёр</a>
    </header>

    <!-- БОКОВОЕ МЕНЮ -->
    <nav class="side-menu" id="sideMenu">
        <a href="document.html" class="active">🏠 Главная</a>
        <a href="index.html">🧠 Онлайн тренажёр</a>
    </nav>
    <div class="overlay" id="overlay"></div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="main-content">
        <div class="doc-card">
            <h1>📖 Учебный материал</h1>
            <p style="color: var(--sub); margin-bottom: 20px; padding-left: 12px; border-left: 3px solid #2a7faa;">
                Просмотрите документ ниже или скачайте его на устройство
            </p>

            <div class="document-viewer">
                <iframe id="pdfViewer"
                        src="docs/finance-guide.pdf#toolbar=0&navpanes=0&scrollbar=1"
                        title="Просмотр PDF документа">
                </iframe>
                <div id="pdfFallback" class="no-pdf-warning">
                    ⚠️ Не удалось загрузить PDF. Возможно, файл отсутствует. Вы всё равно можете скачать документ по кнопке ниже.
                </div>
            </div>

            <div class="actions">
                <a href="index.html" class="btn">🧠 Онлайн‑тренажёр</a>
                <a href="docs/finance-guide.pdf" download class="btn btn-primary">⬇️ Скачать документ</a>
            </div>
        </div>
    </main>

    <script>
        // Управление гамбургер-меню
        const hamburger = document.getElementById('hamburgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');

        function openMenu() {
            sideMenu.classList.add('open');
            overlay.classList.add('show');
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            overlay.classList.remove('show');
        }

        hamburger.addEventListener('click', () => {
            if (sideMenu.classList.contains('open')) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        overlay.addEventListener('click', closeMenu);

        // Закрывать меню при клике на ссылку (для мобильных)
        document.querySelectorAll('.side-menu a').forEach(link => {
            link.addEventListener('click', () => {
                closeMenu();
            });
        });

        // Резервное предупреждение, если PDF не загрузился
        setTimeout(() => {
            const iframe = document.getElementById('pdfViewer');
            try {
                if (iframe.contentDocument && iframe.contentDocument.body.innerHTML.trim() === '') {
                    document.getElementById('pdfFallback').style.display = 'block';
                }
            } catch (e) {
                // Ограничения безопасности – оставляем как есть
            }
        }, 2500);
    </script>
</body>
</html>
